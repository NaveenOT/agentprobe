[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentprobe"
version = "0.1.0"
description = "Multi-agent prompt injection testing framework"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "motor>=3.6,<4",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<1",
  "langchain-groq>=0.2,<1",
  "playwright>=1.49,<2",
  "datasets>=3.1,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]
datasets = [
  "chromadb>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/agentprobe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["apps/api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"apps/api/agentprobe/main.py" = ["B008"]
